# ============================================
# AxioVital Provider Operating Environment
# Docker Compose — Local Development
# ============================================

services:
  # ---- Application Services ----

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:4000
      - NEXT_PUBLIC_AI_SERVICE_URL=http://ai-service:8000
    depends_on:
      - backend
    networks:
      - axiovital-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000
      - DATABASE_URL=postgresql://axiovital_user:change-me-in-production@postgres:5432/axiovital
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OPENSEARCH_URL=http://opensearch:9200
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=change-me-in-production
      - JWT_REFRESH_SECRET=change-me-refresh-in-production
      - CORS_ORIGINS=http://localhost:3000
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ACCESS_KEY=axiovital_minio
      - MINIO_SECRET_KEY=change-me-in-production
      - MINIO_USE_SSL=false
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      redpanda:
        condition: service_healthy
      opensearch:
        condition: service_started
    networks:
      - axiovital-network
    restart: unless-stopped

  ai-service:
    build:
      context: .
      dockerfile: infrastructure/docker/ai-service.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=axiovital-ai
      - DATABASE_URL=postgresql://axiovital_user:change-me-in-production@postgres:5432/axiovital
      - REDIS_URL=redis://redis:6379
      - BACKEND_URL=http://backend:4000
      - LOG_LEVEL=info
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - axiovital-network
    restart: unless-stopped

  # ---- Data Services ----

  postgres:
    build:
      context: .
      dockerfile: infrastructure/docker/postgres.Dockerfile
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=axiovital
      - POSTGRES_USER=axiovital_user
      - POSTGRES_PASSWORD=change-me-in-production
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - axiovital-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiovital_user -d axiovital"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    build:
      context: .
      dockerfile: infrastructure/docker/redis.Dockerfile
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - axiovital-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  opensearch:
    build:
      context: .
      dockerfile: infrastructure/docker/opensearch.Dockerfile
    ports:
      - "9200:9200"
      - "9600:9600"
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - axiovital-network
    restart: unless-stopped

  # ---- Object Storage (MinIO / S3-compatible) ----

  minio:
    build:
      context: .
      dockerfile: infrastructure/docker/minio.Dockerfile
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    environment:
      - MINIO_ROOT_USER=axiovital_minio
      - MINIO_ROOT_PASSWORD=change-me-in-production
    volumes:
      - minio-data:/data
    networks:
      - axiovital-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      - MINIO_ROOT_USER=axiovital_minio
      - MINIO_ROOT_PASSWORD=change-me-in-production
    volumes:
      - ./infrastructure/docker/minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    networks:
      - axiovital-network
    restart: "no"

  # ---- Event Streaming (Redpanda — Kafka-compatible) ----

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"   # Kafka API (external)
      - "18082:18082"   # HTTP Proxy (external)
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - axiovital-network
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.0
    ports:
      - "8080:8080"
    environment:
      - CONFIG_FILEPATH=/tmp/config.yml
    volumes:
      - ./infrastructure/docker/redpanda/console-config.yml:/tmp/config.yml:ro
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - axiovital-network
    restart: unless-stopped

# ---- Networks ----
networks:
  axiovital-network:
    driver: bridge

# ---- Volumes ----
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  opensearch-data:
    driver: local
  minio-data:
    driver: local
  redpanda-data:
    driver: local
